name: deploy-develop

on:
  workflow_dispatch:
    inputs:
      deployment_stage:
        description: Separately approved deploy transition
        required: true
        type: choice
        options:
        - migration
        - service
      stage_receipt_base64:
        description: Operator-held signed stage receipt bytes, base64 encoded
        required: true
        type: string
      stage_receipt_bundle_base64:
        description: Detached Sigstore bundle for the operator-held stage receipt, base64 encoded
        required: true
        type: string
      migration_receipt_base64:
        description: Signed migration-stage receipt required only for service
        required: false
        type: string
      migration_receipt_bundle_base64:
        description: Detached Sigstore bundle for the signed migration-stage receipt required only for service
        required: false
        type: string
      migration_success_receipt_base64:
        description: Separately signed migration-success receipt required only for service
        required: false
        type: string
      migration_success_receipt_bundle_base64:
        description: Detached Sigstore bundle for migration-success receipt required only for service
        required: false
        type: string
      migration_readback_receipt_base64:
        description: Signed post-migration database/schema/authority readback receipt required only for service
        required: false
        type: string
      migration_readback_receipt_bundle_base64:
        description: Detached Sigstore bundle for the post-migration database/schema/authority readback receipt required only for service
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: develop
    concurrency:
      group: deploy-develop
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        # v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.12
        # v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up uv
        # v6.8.0
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.5"
          checksum: "68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2"
          enable-cache: true

      - name: Enforce protected develop source
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/develop"

      - name: Install Cosign
        # v3.0.6
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22
        with:
          cosign-release: "v3.0.6"

      - name: Verify signed stage receipt before cloud authentication
        env:
          STAGE_RECEIPT_BASE64: ${{ inputs.stage_receipt_base64 }}
          STAGE_RECEIPT_BUNDLE_BASE64: ${{ inputs.stage_receipt_bundle_base64 }}
          STAGE_RECEIPT_CERTIFICATE_IDENTITY: ${{ vars.STAGE_RECEIPT_CERTIFICATE_IDENTITY }}
          MIGRATION_SUCCESS_RECEIPT_BASE64: ${{ inputs.migration_success_receipt_base64 }}
          MIGRATION_SUCCESS_RECEIPT_BUNDLE_BASE64: ${{ inputs.migration_success_receipt_bundle_base64 }}
          MIGRATION_SUCCESS_RECEIPT_CERTIFICATE_IDENTITY: ${{ vars.MIGRATION_SUCCESS_RECEIPT_CERTIFICATE_IDENTITY }}
          MIGRATION_RECEIPT_BASE64: ${{ inputs.migration_receipt_base64 }}
          MIGRATION_RECEIPT_BUNDLE_BASE64: ${{ inputs.migration_receipt_bundle_base64 }}
          MIGRATION_READBACK_RECEIPT_BASE64: ${{ inputs.migration_readback_receipt_base64 }}
          MIGRATION_READBACK_RECEIPT_BUNDLE_BASE64: ${{ inputs.migration_readback_receipt_bundle_base64 }}
          MIGRATION_READBACK_RECEIPT_CERTIFICATE_IDENTITY: ${{ vars.MIGRATION_READBACK_RECEIPT_CERTIFICATE_IDENTITY }}
          DEPLOYMENT_STAGE: ${{ inputs.deployment_stage }}
        run: |
          set -euo pipefail
          mkdir -p build/transition-authority
          test -n "$STAGE_RECEIPT_BASE64"
          test -n "$STAGE_RECEIPT_BUNDLE_BASE64"
          test -n "$STAGE_RECEIPT_CERTIFICATE_IDENTITY"
          printf '%s' "$STAGE_RECEIPT_BASE64" | base64 --decode > build/transition-authority/stage-receipt.json
          printf '%s' "$STAGE_RECEIPT_BUNDLE_BASE64" | base64 --decode > build/transition-authority/stage-receipt.sigstore.json
          cosign verify-blob build/transition-authority/stage-receipt.json --bundle build/transition-authority/stage-receipt.sigstore.json --certificate-identity "$STAGE_RECEIPT_CERTIFICATE_IDENTITY" --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
          if [ "$DEPLOYMENT_STAGE" = "service" ]; then
            test -n "$MIGRATION_SUCCESS_RECEIPT_BASE64"
            test -n "$MIGRATION_SUCCESS_RECEIPT_BUNDLE_BASE64"
            test -n "$MIGRATION_SUCCESS_RECEIPT_CERTIFICATE_IDENTITY"
            test -n "$MIGRATION_RECEIPT_BASE64"
            test -n "$MIGRATION_RECEIPT_BUNDLE_BASE64"
            test -n "$MIGRATION_READBACK_RECEIPT_BASE64"
            test -n "$MIGRATION_READBACK_RECEIPT_BUNDLE_BASE64"
            test -n "$MIGRATION_READBACK_RECEIPT_CERTIFICATE_IDENTITY"
            printf '%s' "$MIGRATION_RECEIPT_BASE64" | base64 --decode > build/transition-authority/migration-receipt.json
            printf '%s' "$MIGRATION_RECEIPT_BUNDLE_BASE64" | base64 --decode > build/transition-authority/migration-receipt.sigstore.json
            cosign verify-blob build/transition-authority/migration-receipt.json --bundle build/transition-authority/migration-receipt.sigstore.json --certificate-identity "$STAGE_RECEIPT_CERTIFICATE_IDENTITY" --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
            printf '%s' "$MIGRATION_SUCCESS_RECEIPT_BASE64" | base64 --decode > build/transition-authority/migration-success-receipt.json
            printf '%s' "$MIGRATION_SUCCESS_RECEIPT_BUNDLE_BASE64" | base64 --decode > build/transition-authority/migration-success-receipt.sigstore.json
            cosign verify-blob build/transition-authority/migration-success-receipt.json --bundle build/transition-authority/migration-success-receipt.sigstore.json --certificate-identity "$MIGRATION_SUCCESS_RECEIPT_CERTIFICATE_IDENTITY" --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
            printf '%s' "$MIGRATION_READBACK_RECEIPT_BASE64" | base64 --decode > build/transition-authority/migration-database-authority-readback.json
            printf '%s' "$MIGRATION_READBACK_RECEIPT_BUNDLE_BASE64" | base64 --decode > build/transition-authority/migration-database-authority-readback.sigstore.json
            cosign verify-blob build/transition-authority/migration-database-authority-readback.json --bundle build/transition-authority/migration-database-authority-readback.sigstore.json --certificate-identity "$MIGRATION_READBACK_RECEIPT_CERTIFICATE_IDENTITY" --certificate-oidc-issuer "https://token.actions.githubusercontent.com"
            uv run python scripts/verify_migration_database_readback.py --readback-receipt build/transition-authority/migration-database-authority-readback.json --migration-receipt build/transition-authority/migration-receipt.json --migration-success-receipt build/transition-authority/migration-success-receipt.json
          fi

      - name: Initialize failed deploy result
        run: |
          set -euo pipefail
          mkdir -p build
          python - <<'PY'
          import json
          from pathlib import Path
          Path("build/deploy-result.json").write_text(json.dumps({"result": "failed", "current_stage": "pre_deploy_validation", "qualification_executed": False, "recovery_disposition": "forward recovery or teardown/rebuild required"}, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Authenticate artifact verifier to Google Cloud
        id: artifact_verifier_auth
        # v2.1.10
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_ARTIFACT_VERIFIER_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: true

      - name: Verify direct OCI image authority
        env:
          MANAGED_REPOSITORY: us-east4-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/staff-tracer-images/staff-tracer
          BUILD_CERTIFICATE_IDENTITY: ${{ vars.BUILD_CERTIFICATE_IDENTITY }}
          ARTIFACT_VERIFIER_ACCESS_TOKEN: ${{ steps.artifact_verifier_auth.outputs.access_token }}
          DOCKER_CONFIG: ${{ runner.temp }}/artifact-verifier-docker
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_VERIFIER_ACCESS_TOKEN"
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$ARTIFACT_VERIFIER_ACCESS_TOKEN" | docker login us-east4-docker.pkg.dev --username oauth2accesstoken --password-stdin
          IMAGE_TAG="$MANAGED_REPOSITORY:${GITHUB_SHA}"
          mkdir -p build/oci-authority
          cosign verify --certificate-identity "$BUILD_CERTIFICATE_IDENTITY" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" --output json "$IMAGE_TAG" > build/oci-authority/signature.json
          IMAGE_DIGEST="$(python - <<'PY'
          import json
          from pathlib import Path
          records = json.loads(Path("build/oci-authority/signature.json").read_text(encoding="utf-8"))
          print(records[0]["critical"]["image"]["docker-manifest-digest"])
          PY
          )"
          MANAGED_IMAGE="${MANAGED_REPOSITORY}@${IMAGE_DIGEST}"
          cosign verify-attestation --type slsaprovenance1 --certificate-identity "$BUILD_CERTIFICATE_IDENTITY" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" --output json "$MANAGED_IMAGE" > build/oci-authority/provenance.json
          cosign verify-attestation --type https://spdx.dev/Document --certificate-identity "$BUILD_CERTIFICATE_IDENTITY" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" --output json "$MANAGED_IMAGE" > build/oci-authority/image-sbom.json
          cosign verify-attestation --type https://golden-rose.nousresearch.com/attestations/application-sbom-checksums/v1 --certificate-identity "$BUILD_CERTIFICATE_IDENTITY" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" --output json "$MANAGED_IMAGE" > build/oci-authority/application-sbom.json
          uv run python scripts/verify_deploy_image_authority.py --image "$MANAGED_IMAGE" --signature build/oci-authority/signature.json --provenance build/oci-authority/provenance.json --image-sbom build/oci-authority/image-sbom.json --application-sbom build/oci-authority/application-sbom.json --certificate-identity "$BUILD_CERTIFICATE_IDENTITY" --source-commit "$GITHUB_SHA"
          printf 'MANAGED_IMAGE=%s\nIMAGE_DIGEST=%s\n' "$MANAGED_IMAGE" "$IMAGE_DIGEST" >> "$GITHUB_ENV"

      - name: Clear artifact verifier credential context
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/artifact-verifier-docker
        run: |
          set -euo pipefail
          verifier_google_application_credentials="${GOOGLE_APPLICATION_CREDENTIALS:-}"
          verifier_cloudsdk_credentials="${CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE:-}"
          verifier_google_gha_creds_path="${GOOGLE_GHA_CREDS_PATH:-}"
          docker logout us-east4-docker.pkg.dev
          rm -rf "$DOCKER_CONFIG"
          for credential_path in "$verifier_google_application_credentials" "$verifier_cloudsdk_credentials" "$verifier_google_gha_creds_path"; do
            if [ -n "$credential_path" ]; then
              rm -f "$credential_path"
            fi
          done
          printf 'GOOGLE_APPLICATION_CREDENTIALS=\n' >> "$GITHUB_ENV"
          printf 'CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=\n' >> "$GITHUB_ENV"
          printf 'GOOGLE_GHA_CREDS_PATH=\n' >> "$GITHUB_ENV"
          printf 'DOCKER_CONFIG=\n' >> "$GITHUB_ENV"
          test ! -e "$DOCKER_CONFIG"
          [ -z "$verifier_google_application_credentials" ] || test ! -e "$verifier_google_application_credentials"
          [ -z "$verifier_cloudsdk_credentials" ] || test ! -e "$verifier_cloudsdk_credentials"
          [ -z "$verifier_google_gha_creds_path" ] || test ! -e "$verifier_google_gha_creds_path"

      - name: Validate signed stage receipt after image digest
        env:
          DEPLOYMENT_STAGE: ${{ inputs.deployment_stage }}
        run: |
          set -euo pipefail
          args=(--receipt build/transition-authority/stage-receipt.json --stage "$DEPLOYMENT_STAGE" --source-sha "$GITHUB_SHA" --image-digest "$IMAGE_DIGEST")
          if [ "$DEPLOYMENT_STAGE" = "service" ]; then
            args+=(--migration-receipt build/transition-authority/migration-receipt.json)
            args+=(--migration-success-receipt build/transition-authority/migration-success-receipt.json)
          fi
          uv run python scripts/verify_stage_receipt.py "${args[@]}" > build/transition-authority/stage-receipt.sha256

      - name: Authenticate deployer to Google Cloud
        id: deployer_auth
        # v2.1.10
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: true

      - name: Set up gcloud
        # v2.1.4
        uses: google-github-actions/setup-gcloud@77e7a554d41e2ee56fc945c52dfd3f33d12def9a

      - name: Extract and validate selected live configuration projection
        env:
          DEPLOYMENT_STAGE: ${{ inputs.deployment_stage }}
        run: |
          set -euo pipefail
          if [ "$DEPLOYMENT_STAGE" = "migration" ]; then
            gcloud run jobs describe run-migrations --project "${{ vars.GCP_PROJECT_ID }}" --region us-east4 --format=json > build/transition-authority/live-resource.json
          else
            gcloud run services describe staff-tracer --project "${{ vars.GCP_PROJECT_ID }}" --region us-east4 --format=json > build/transition-authority/live-resource.json
            gcloud run services get-iam-policy staff-tracer --project "${{ vars.GCP_PROJECT_ID }}" --region us-east4 --format=json > build/transition-authority/live-service-iam-policy.json
          fi
          export DEPLOYMENT_STAGE
          python - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path

          module_path = Path("scripts/verify_stage_receipt.py")
          spec = importlib.util.spec_from_file_location("verify_stage_receipt", module_path)
          if spec is None or spec.loader is None:
              raise SystemExit("could not load stage receipt verifier")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          resource = json.loads(Path("build/transition-authority/live-resource.json").read_text(encoding="utf-8"))
          iam_policy = None
          if os.environ["DEPLOYMENT_STAGE"] == "service":
              iam_policy = json.loads(
                  Path("build/transition-authority/live-service-iam-policy.json").read_text(
                      encoding="utf-8"
                  )
              )
          projection = module.extract_live_configuration_projection(
              resource, stage=os.environ["DEPLOYMENT_STAGE"], iam_policy=iam_policy
          )
          Path("build/transition-authority/live-configuration-projection.json").write_text(
              json.dumps(projection, sort_keys=True, allow_nan=False) + "\n", encoding="utf-8"
          )
          PY
          args=(--receipt build/transition-authority/stage-receipt.json --stage "$DEPLOYMENT_STAGE" --source-sha "$GITHUB_SHA" --image-digest "$IMAGE_DIGEST" --live-configuration-projection build/transition-authority/live-configuration-projection.json)
          if [ "$DEPLOYMENT_STAGE" = "service" ]; then
            args+=(--migration-receipt build/transition-authority/migration-receipt.json)
            args+=(--migration-success-receipt build/transition-authority/migration-success-receipt.json)
          fi
          uv run python scripts/verify_stage_receipt.py "${args[@]}"

      - name: Execute migration transition
        if: inputs.deployment_stage == 'migration'
        run: |
          set -euo pipefail
          mkdir -p build/transition-authority
          gcloud run jobs execute run-migrations --project "${{ vars.GCP_PROJECT_ID }}" --region us-east4 --wait --format=json > build/transition-authority/migration-execution.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("build/deploy-result.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          payload.update({"result": "success", "current_stage": "migration_execution", "image_digest": os.environ["IMAGE_DIGEST"]})
          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Write migration success receipt
        if: inputs.deployment_stage == 'migration'
        run: |
          set -euo pipefail
          uv run python scripts/write_migration_success_receipt.py --migration-receipt build/transition-authority/stage-receipt.json --deploy-result build/deploy-result.json --execution build/transition-authority/migration-execution.json --output build/transition-authority/migration-success-receipt.json

      - name: Sign migration success receipt
        if: inputs.deployment_stage == 'migration'
        env:
          MIGRATION_SUCCESS_RECEIPT_CERTIFICATE_IDENTITY: ${{ vars.MIGRATION_SUCCESS_RECEIPT_CERTIFICATE_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$MIGRATION_SUCCESS_RECEIPT_CERTIFICATE_IDENTITY"
          cosign sign-blob --yes --bundle build/transition-authority/migration-success-receipt.sigstore.json build/transition-authority/migration-success-receipt.json >/dev/null

      - name: Upload migration success receipt
        if: inputs.deployment_stage == 'migration'
        # v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: migration-success-receipt
          path: build/transition-authority/migration-success-receipt.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload migration success receipt bundle
        if: inputs.deployment_stage == 'migration'
        # v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: migration-success-receipt-bundle
          path: build/transition-authority/migration-success-receipt.sigstore.json
          if-no-files-found: error
          retention-days: 14

      - name: Verify service readiness transition
        if: inputs.deployment_stage == 'service'
        run: |
          set -euo pipefail
          SERVICE_JSON=$(gcloud run services describe staff-tracer --project "${{ vars.GCP_PROJECT_ID }}" --region us-east4 --format=json)
          export SERVICE_JSON
          python - <<'PY'
          import json, os
          service = json.loads(os.environ["SERVICE_JSON"])
          ready = next((item for item in service.get("status", {}).get("conditions", []) if item.get("type") == "Ready"), None)
          if not ready or ready.get("status") != "True":
              raise SystemExit("cloud run ready condition must be True")
          containers = service.get("template", {}).get("containers")
          if not isinstance(containers, list) or len(containers) != 1 or not isinstance(containers[0], dict):
              raise SystemExit("ready service must contain exactly one Cloud Run v2 container")
          image = containers[0].get("image")
          if image != os.environ["MANAGED_IMAGE"]:
              raise SystemExit("ready service image must match the direct Cosign-verified image")
          PY

      - name: Record deploy result
        if: always()
        env:
          DEPLOYMENT_STAGE: ${{ inputs.deployment_stage }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("build/deploy-result.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          payload.update({"current_stage": os.environ["DEPLOYMENT_STAGE"], "image_digest": os.environ.get("IMAGE_DIGEST"), "qualification_executed": False})
          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload deploy result evidence
        if: always()
        # v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deploy-result
          path: build/deploy-result.json
          if-no-files-found: error
          retention-days: 14
