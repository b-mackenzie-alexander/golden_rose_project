name: infrastructure-quality

on:
  pull_request:
    paths:
      - "infra/gcp/**"
      - "scripts/validate_terraform_static.py"
      - "tests/unit/test_terraform_hygiene.py"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  static-validation:
    name: Terraform static validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        # v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up uv
        # v6.8.0
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e

      - name: Set up Terraform
        # v3
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.15.8"

      - name: Run Terraform local validation
        run: |
          terraform fmt -check -recursive infra/gcp
          terraform -chdir=infra/gcp init -backend=false -input=false
          terraform -chdir=infra/gcp validate

      - name: Run Terraform static validation
        run: python scripts/validate_terraform_static.py

      - name: Run Terraform hygiene tests
        run: uv run pytest tests/unit/test_terraform_hygiene.py
