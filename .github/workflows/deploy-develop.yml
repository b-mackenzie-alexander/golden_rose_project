name: deploy-develop

on:
  workflow_dispatch:
    inputs:
      deployment_stage:
        description: Stage selected inside the separately approved eight-hour deployment packet
        required: true
        type: choice
        options:
        - migration
        - database-verification
        - staff-bootstrap
        - service
      runtime_profile:
        description: Reviewed runtime profile already applied by Terraform before this transition readback
        required: true
        type: choice
        options:
        - synthetic_develop_demo
        - controlled_live_data_staff_pilot

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: develop
    concurrency:
      group: deploy-develop
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        # v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.12
        # v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up uv
        # v6.8.0
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.12.5"
          checksum: "68a509da24b06b4223a1c0175fb5eb5bc79342b76cbeff0cfe51ac3f5b17b6b2"
          enable-cache: true

      - name: Enforce protected develop source
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/develop"

      - name: Install Cosign
        # v3.0.6
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22
        with:
          cosign-release: "v3.0.6"

      - name: Set up Docker Buildx
        # v3.11.1
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Initialize failed deploy result
        run: |
          set -euo pipefail
          mkdir -p build
          python - <<'PY'
          import json
          from pathlib import Path
          Path("build/deploy-result.json").write_text(json.dumps({"result": "failed", "current_stage": "pre_deploy_validation", "qualification_executed": False, "recovery_disposition": "forward recovery or teardown/rebuild required"}, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Authenticate artifact verifier to Google Cloud
        id: artifact_verifier_auth
        # v2.1.10
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_ARTIFACT_VERIFIER_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: true

      - name: Verify direct OCI image authority
        env:
          MANAGED_REPOSITORY: us-east4-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/staff-tracer-images/staff-tracer
          BUILD_CERTIFICATE_IDENTITY: ${{ vars.BUILD_CERTIFICATE_IDENTITY }}
          ARTIFACT_VERIFIER_ACCESS_TOKEN: ${{ steps.artifact_verifier_auth.outputs.access_token }}
          DOCKER_CONFIG: ${{ runner.temp }}/artifact-verifier-docker
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_VERIFIER_ACCESS_TOKEN"
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$ARTIFACT_VERIFIER_ACCESS_TOKEN" | docker login us-east4-docker.pkg.dev --username oauth2accesstoken --password-stdin
          IMAGE_TAG="$MANAGED_REPOSITORY:${GITHUB_SHA}"
          mkdir -p build/oci-authority
          cosign verify --certificate-identity "$BUILD_CERTIFICATE_IDENTITY" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" --output json "$IMAGE_TAG" > build/oci-authority/tag-signature.json
          ADMITTED_IMAGE_DIGEST="$(python - <<'PY'
          import json
          from pathlib import Path
          records = json.loads(Path("build/oci-authority/tag-signature.json").read_text(encoding="utf-8"))
          print(records[0]["critical"]["image"]["docker-manifest-digest"])
          PY
          )"
          ADMITTED_MANAGED_IMAGE="${MANAGED_REPOSITORY}@${ADMITTED_IMAGE_DIGEST}"
          docker buildx imagetools inspect --raw "$IMAGE_TAG" > build/oci-authority/image-index.json
          IMAGE_DIGEST="$(uv run python scripts/resolve_deployment_image_digest.py --root-digest "$ADMITTED_IMAGE_DIGEST" --platform linux/amd64 < build/oci-authority/image-index.json)"
          MANAGED_IMAGE="${MANAGED_REPOSITORY}@${IMAGE_DIGEST}"
          cosign verify --certificate-identity "$BUILD_CERTIFICATE_IDENTITY" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" --output json "$ADMITTED_MANAGED_IMAGE" > build/oci-authority/signature.json
          cosign verify-attestation --type slsaprovenance1 --certificate-identity "$BUILD_CERTIFICATE_IDENTITY" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" --output json "$ADMITTED_MANAGED_IMAGE" > build/oci-authority/provenance.json
          cosign verify-attestation --type https://spdx.dev/Document --certificate-identity "$BUILD_CERTIFICATE_IDENTITY" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" --output json "$ADMITTED_MANAGED_IMAGE" > build/oci-authority/image-sbom.json
          cosign verify-attestation --type https://golden-rose.nousresearch.com/attestations/application-sbom-checksums/v1 --certificate-identity "$BUILD_CERTIFICATE_IDENTITY" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" --output json "$ADMITTED_MANAGED_IMAGE" > build/oci-authority/application-sbom.json
          uv run python scripts/verify_deploy_image_authority.py --image "$ADMITTED_MANAGED_IMAGE" --signature build/oci-authority/signature.json --provenance build/oci-authority/provenance.json --image-sbom build/oci-authority/image-sbom.json --application-sbom build/oci-authority/application-sbom.json --certificate-identity "$BUILD_CERTIFICATE_IDENTITY" --source-commit "$GITHUB_SHA"
          printf 'MANAGED_IMAGE=%s\nIMAGE_DIGEST=%s\nADMITTED_MANAGED_IMAGE=%s\nADMITTED_IMAGE_DIGEST=%s\n' "$MANAGED_IMAGE" "$IMAGE_DIGEST" "$ADMITTED_MANAGED_IMAGE" "$ADMITTED_IMAGE_DIGEST" >> "$GITHUB_ENV"

      - name: Clear artifact verifier credential context
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/artifact-verifier-docker
        run: |
          set -euo pipefail
          verifier_google_application_credentials="${GOOGLE_APPLICATION_CREDENTIALS:-}"
          verifier_cloudsdk_credentials="${CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE:-}"
          verifier_google_gha_creds_path="${GOOGLE_GHA_CREDS_PATH:-}"
          docker logout us-east4-docker.pkg.dev
          rm -rf "$DOCKER_CONFIG"
          for credential_path in "$verifier_google_application_credentials" "$verifier_cloudsdk_credentials" "$verifier_google_gha_creds_path"; do
            if [ -n "$credential_path" ]; then
              rm -f "$credential_path"
            fi
          done
          printf 'GOOGLE_APPLICATION_CREDENTIALS=\n' >> "$GITHUB_ENV"
          printf 'CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE=\n' >> "$GITHUB_ENV"
          printf 'GOOGLE_GHA_CREDS_PATH=\n' >> "$GITHUB_ENV"
          printf 'DOCKER_CONFIG=\n' >> "$GITHUB_ENV"
          test ! -e "$DOCKER_CONFIG"
          [ -z "$verifier_google_application_credentials" ] || test ! -e "$verifier_google_application_credentials"
          [ -z "$verifier_cloudsdk_credentials" ] || test ! -e "$verifier_cloudsdk_credentials"
          [ -z "$verifier_google_gha_creds_path" ] || test ! -e "$verifier_google_gha_creds_path"


      - name: Authenticate deployer to Google Cloud
        id: deployer_auth
        # v2.1.10
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: true

      - name: Set up gcloud
        # v2.1.4
        uses: google-github-actions/setup-gcloud@77e7a554d41e2ee56fc945c52dfd3f33d12def9a


      - name: Execute migration transition
        if: inputs.deployment_stage == 'migration'
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          DEPLOYMENT_RUNTIME_PROFILE: ${{ inputs.runtime_profile }}
        run: |
          set -euo pipefail
          mkdir -p build/transition-authority
          JOB_JSON=$(python scripts/read_cloud_run_v2.py --project "$GCP_PROJECT_ID" --region us-east4 --kind jobs --name run-migrations)
          export JOB_JSON
          python - <<'PY'
          import json
          import os

          job = json.loads(os.environ["JOB_JSON"])
          template = job.get("template", {})
          task_template = template.get("template", {})
          containers = task_template.get("containers")
          if not isinstance(containers, list) or len(containers) != 1 or not isinstance(containers[0], dict):
              raise SystemExit("migration job must contain exactly one reviewed container")
          if containers[0].get("image") != os.environ["MANAGED_IMAGE"]:
              raise SystemExit("migration job image must match the direct Cosign-verified image")
          if task_template.get("serviceAccount") != f"staff-tracer-migration@{os.environ['GCP_PROJECT_ID']}.iam.gserviceaccount.com":
              raise SystemExit("migration job service account drifted")
          if template.get("parallelism") != 1 or template.get("taskCount") != 1:
              raise SystemExit("migration job execution cardinality drifted")
          if task_template.get("maxRetries") != 0 or task_template.get("timeout") != "1800s":
              raise SystemExit("migration job retry or timeout posture drifted")
          if containers[0].get("command") != ["golden-rose-migrate"]:
              raise SystemExit("migration job command drifted")
          if containers[0].get("args") not in (None, []):
              raise SystemExit("migration job arguments drifted")
          vpc_access = task_template.get("vpcAccess")
          interfaces = vpc_access.get("networkInterfaces") if isinstance(vpc_access, dict) else None
          if not isinstance(interfaces, list) or len(interfaces) != 1 or not isinstance(interfaces[0], dict):
              raise SystemExit("migration job VPC interface drifted")
          if vpc_access.get("egress") != "PRIVATE_RANGES_ONLY":
              raise SystemExit("migration job VPC egress drifted")
          if interfaces[0].get("network") != f"projects/{os.environ['GCP_PROJECT_ID']}/global/networks/develop-vpc":
              raise SystemExit("migration job VPC network drifted")
          if interfaces[0].get("subnetwork") != f"projects/{os.environ['GCP_PROJECT_ID']}/regions/us-east4/subnetworks/develop-direct-vpc":
              raise SystemExit("migration job VPC subnetwork drifted")
          environment = {}
          for item in containers[0].get("env", []):
              if not isinstance(item, dict) or not isinstance(item.get("name"), str):
                  raise SystemExit("migration job environment is malformed")
              if item["name"] in environment:
                  raise SystemExit("migration job environment contains duplicate names")
              if "value" in item:
                  environment[item["name"]] = {"value": item.get("value")}
              else:
                  secret_ref = item.get("valueSource", {}).get("secretKeyRef", {})
                  environment[item["name"]] = {
                      "secret": secret_ref.get("secret"),
                      "version": secret_ref.get("version"),
                  }
          expected_environment = {
              "GOLDEN_ROSE_ENVIRONMENT": {"value": "develop"},
              "GOLDEN_ROSE_AUTH_MODE": {"value": "synthetic"},
              "GOLDEN_ROSE_DEPLOYMENT_TARGET": {"value": "gcp-develop-private-synthetic"},
              "GOLDEN_ROSE_DEPLOYED_IMAGE_DIGEST": {"value": os.environ["IMAGE_DIGEST"]},
              "GOLDEN_ROSE_MIGRATION_ASSUMED_ROLE": {"value": "golden_rose_schema_owner"},
              "GOLDEN_ROSE_DATABASE_URL": {"secret": "migration-database-url", "version": "latest"},
              "GOLDEN_ROSE_SYNTHETIC_STAFF_ID": {"secret": "synthetic-staff-id", "version": "latest"},
          }
          if set(environment) != {*expected_environment, "GOLDEN_ROSE_PUBLIC_ENVIRONMENT_LABEL"}:
              raise SystemExit("migration job environment inventory drifted")
          if any(environment.get(name) != value for name, value in expected_environment.items()):
              raise SystemExit("migration job environment value drifted")
          public_label = environment["GOLDEN_ROSE_PUBLIC_ENVIRONMENT_LABEL"].get("value", "")
          if not {"non-production", "synthetic"}.issubset(set(str(public_label).lower().split())):
              raise SystemExit("migration job public label lost synthetic-only posture")
          expected_data_boundary = "controlled-live-data-staff-pilot" if os.environ["DEPLOYMENT_RUNTIME_PROFILE"] == "controlled_live_data_staff_pilot" else "fictional-synthetic-only"
          required_labels = {
              "environment": "develop",
              "data_boundary": expected_data_boundary,
              "managed_by": "terraform",
              "service": "staff-tracer",
              "cost_center": "develop",
              "owner": "technical-owner",
              "teardown": "intentional-runbook-only",
              "goog-terraform-provisioned": "true",
          }
          labels = job.get("labels")
          if labels != required_labels:
              raise SystemExit("migration job synthetic label posture drifted")
          PY
          gcloud run jobs execute run-migrations --project "${{ vars.GCP_PROJECT_ID }}" --region us-east4 --wait --format=json > build/transition-authority/migration-execution.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("build/deploy-result.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          payload.update({"result": "success", "current_stage": "migration_execution", "image_digest": os.environ["IMAGE_DIGEST"], "admitted_image_digest": os.environ["ADMITTED_IMAGE_DIGEST"]})
          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY


      - name: Execute database authority verification
        if: inputs.deployment_stage == 'database-verification'
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          DEPLOYMENT_RUNTIME_PROFILE: ${{ inputs.runtime_profile }}
        run: |
          set -euo pipefail
          mkdir -p build/transition-authority
          JOB_JSON=$(python scripts/read_cloud_run_v2.py --project "$GCP_PROJECT_ID" --region us-east4 --kind jobs --name verify-database-authority)
          export JOB_JSON
          python - <<'PY'
          import json
          import os

          job = json.loads(os.environ["JOB_JSON"])
          template = job.get("template", {})
          task_template = template.get("template", {})
          containers = task_template.get("containers")
          if not isinstance(containers, list) or len(containers) != 1 or not isinstance(containers[0], dict):
              raise SystemExit("database authority job must contain exactly one reviewed container")
          if containers[0].get("image") != os.environ["MANAGED_IMAGE"]:
              raise SystemExit("database authority job image must match the direct Cosign-verified image")
          if containers[0].get("command") != ["python", "/app/scripts/verify_database_authority.py"]:
              raise SystemExit("database authority job command drifted")
          if containers[0].get("args") not in (None, []):
              raise SystemExit("database authority job arguments drifted")
          expected_data_boundary = "controlled-live-data-staff-pilot" if os.environ["DEPLOYMENT_RUNTIME_PROFILE"] == "controlled_live_data_staff_pilot" else "fictional-synthetic-only"
          expected_labels = {
              "environment": "develop",
              "data_boundary": expected_data_boundary,
              "managed_by": "terraform",
              "service": "staff-tracer",
              "cost_center": "develop",
              "owner": "technical-owner",
              "teardown": "intentional-runbook-only",
              "goog-terraform-provisioned": "true",
          }
          if job.get("labels") != expected_labels:
              raise SystemExit("database authority job labels drifted")
          if task_template.get("serviceAccount") != f"staff-tracer-database-verifier@{os.environ['GCP_PROJECT_ID']}.iam.gserviceaccount.com":
              raise SystemExit("database authority job service account drifted")
          if template.get("parallelism") != 1 or template.get("taskCount") != 1:
              raise SystemExit("database authority job execution cardinality drifted")
          if task_template.get("maxRetries") != 0 or task_template.get("timeout") != "600s":
              raise SystemExit("database authority job retry or timeout posture drifted")
          vpc_access = task_template.get("vpcAccess")
          interfaces = vpc_access.get("networkInterfaces") if isinstance(vpc_access, dict) else None
          if not isinstance(interfaces, list) or len(interfaces) != 1 or not isinstance(interfaces[0], dict):
              raise SystemExit("database authority job VPC interface drifted")
          if vpc_access.get("egress") != "PRIVATE_RANGES_ONLY":
              raise SystemExit("database authority job VPC egress drifted")
          if interfaces[0].get("network") != f"projects/{os.environ['GCP_PROJECT_ID']}/global/networks/develop-vpc":
              raise SystemExit("database authority job VPC network drifted")
          if interfaces[0].get("subnetwork") != f"projects/{os.environ['GCP_PROJECT_ID']}/regions/us-east4/subnetworks/develop-direct-vpc":
              raise SystemExit("database authority job VPC subnetwork drifted")
          environment = {}
          for item in containers[0].get("env", []):
              if not isinstance(item, dict) or not isinstance(item.get("name"), str):
                  raise SystemExit("database authority job environment is malformed")
              if item["name"] in environment:
                  raise SystemExit("database authority job environment contains duplicate names")
              secret_ref = item.get("valueSource", {}).get("secretKeyRef", {})
              environment[item["name"]] = {
                  "secret": secret_ref.get("secret"),
                  "version": secret_ref.get("version"),
              }
          expected_environment = {
              "GOLDEN_ROSE_DATABASE_URL": {"secret": "migration-database-url", "version": "latest"},
              "GOLDEN_ROSE_MIGRATION_DATABASE_URL": {"secret": "migration-database-url", "version": "latest"},
              "GOLDEN_ROSE_RUNTIME_DATABASE_URL": {"secret": "runtime-database-url", "version": "latest"},
          }
          if environment != expected_environment:
              raise SystemExit("database authority job environment drifted")
          PY
          gcloud run jobs execute verify-database-authority --project "$GCP_PROJECT_ID" --region us-east4 --wait --format=json > build/transition-authority/database-authority-execution.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("build/deploy-result.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          payload.update({"result": "success", "current_stage": "database_verification", "image_digest": os.environ["IMAGE_DIGEST"], "admitted_image_digest": os.environ["ADMITTED_IMAGE_DIGEST"]})
          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY


      - name: Execute first staff account bootstrap
        if: inputs.deployment_stage == 'staff-bootstrap'
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          DEPLOYMENT_RUNTIME_PROFILE: ${{ inputs.runtime_profile }}
        run: |
          set -euo pipefail
          test "$DEPLOYMENT_RUNTIME_PROFILE" = "controlled_live_data_staff_pilot"
          mkdir -p build/transition-authority
          JOB_JSON=$(python scripts/read_cloud_run_v2.py --project "$GCP_PROJECT_ID" --region us-east4 --kind jobs --name bootstrap-first-staff-account)
          export JOB_JSON
          python - <<'PY'
          import json
          import os

          job = json.loads(os.environ["JOB_JSON"])
          template = job.get("template", {})
          task_template = template.get("template", {})
          containers = task_template.get("containers")
          if not isinstance(containers, list) or len(containers) != 1 or not isinstance(containers[0], dict):
              raise SystemExit("staff bootstrap job must contain exactly one reviewed container")
          if containers[0].get("image") != os.environ["MANAGED_IMAGE"]:
              raise SystemExit("staff bootstrap job image must match the direct Cosign-verified image")
          if containers[0].get("command") != ["golden-rose-bootstrap-first-staff-account"]:
              raise SystemExit("staff bootstrap job command drifted")
          if containers[0].get("args") not in (None, []):
              raise SystemExit("staff bootstrap job arguments drifted")
          expected_labels = {
              "environment": "develop",
              "data_boundary": "controlled-live-data-staff-pilot",
              "managed_by": "terraform",
              "service": "staff-tracer",
              "cost_center": "develop",
              "owner": "technical-owner",
              "teardown": "intentional-runbook-only",
              "goog-terraform-provisioned": "true",
          }
          if job.get("labels") != expected_labels:
              raise SystemExit("staff bootstrap job labels drifted")
          if task_template.get("serviceAccount") != f"staff-tracer-staff-bootstrap@{os.environ['GCP_PROJECT_ID']}.iam.gserviceaccount.com":
              raise SystemExit("staff bootstrap job service account drifted")
          if template.get("parallelism") != 1 or template.get("taskCount") != 1:
              raise SystemExit("staff bootstrap job execution cardinality drifted")
          if task_template.get("maxRetries") != 0 or task_template.get("timeout") != "600s":
              raise SystemExit("staff bootstrap job retry or timeout posture drifted")
          vpc_access = task_template.get("vpcAccess")
          interfaces = vpc_access.get("networkInterfaces") if isinstance(vpc_access, dict) else None
          if not isinstance(interfaces, list) or len(interfaces) != 1 or not isinstance(interfaces[0], dict):
              raise SystemExit("staff bootstrap job VPC interface drifted")
          if vpc_access.get("egress") != "PRIVATE_RANGES_ONLY":
              raise SystemExit("staff bootstrap job VPC egress drifted")
          if interfaces[0].get("network") != f"projects/{os.environ['GCP_PROJECT_ID']}/global/networks/develop-vpc":
              raise SystemExit("staff bootstrap job VPC network drifted")
          if interfaces[0].get("subnetwork") != f"projects/{os.environ['GCP_PROJECT_ID']}/regions/us-east4/subnetworks/develop-direct-vpc":
              raise SystemExit("staff bootstrap job VPC subnetwork drifted")
          environment = {}
          for item in containers[0].get("env", []):
              if not isinstance(item, dict) or not isinstance(item.get("name"), str):
                  raise SystemExit("staff bootstrap job environment is malformed")
              if item["name"] in environment:
                  raise SystemExit("staff bootstrap job environment contains duplicate names")
              if "value" in item:
                  environment[item["name"]] = {"value": item.get("value")}
              else:
                  secret_ref = item.get("valueSource", {}).get("secretKeyRef", {})
                  environment[item["name"]] = {
                      "secret": secret_ref.get("secret"),
                      "version": secret_ref.get("version"),
                  }
          expected_environment = {
              "GOLDEN_ROSE_ENVIRONMENT": {"value": "production"},
              "GOLDEN_ROSE_AUTH_MODE": {"value": "staff_oidc"},
              "GOLDEN_ROSE_DEPLOYMENT_TARGET": {"value": "controlled-live-data-staff-pilot"},
              "GOLDEN_ROSE_DEPLOYED_IMAGE_DIGEST": {"value": os.environ["IMAGE_DIGEST"]},
              "GOLDEN_ROSE_MIGRATION_ASSUMED_ROLE": {"value": "golden_rose_schema_owner"},
              "GOLDEN_ROSE_DATABASE_URL": {"secret": "migration-database-url", "version": "latest"},
          }
          pinned_identity_refs = {
              "GOLDEN_ROSE_BOOTSTRAP_PROVIDER_SUBJECT": "staff-bootstrap-provider-subject",
              "GOLDEN_ROSE_BOOTSTRAP_DISPLAY_NAME": "staff-bootstrap-display-name",
          }
          for name, secret_name in pinned_identity_refs.items():
              secret_ref = environment.get(name)
              if secret_ref is None:
                  raise SystemExit(f"staff bootstrap job missing {name}")
              if secret_ref.get("secret") != secret_name:
                  raise SystemExit(f"staff bootstrap job {name} secret drifted")
              version = secret_ref.get("version")
              if not isinstance(version, str) or not version.isdigit() or version == "0":
                  raise SystemExit(f"staff bootstrap job {name} must pin an enabled numeric secret version")
              expected_environment[name] = {"secret": secret_name, "version": version}
          if environment != expected_environment:
              raise SystemExit("staff bootstrap job environment inventory or value drifted")
          PY
          gcloud run jobs execute bootstrap-first-staff-account --project "$GCP_PROJECT_ID" --region us-east4 --wait --format=json > build/transition-authority/staff-bootstrap-execution.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("build/deploy-result.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          payload.update({"result": "success", "current_stage": "staff_account_bootstrap", "image_digest": os.environ["IMAGE_DIGEST"], "admitted_image_digest": os.environ["ADMITTED_IMAGE_DIGEST"]})
          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY


      - name: Verify service readiness transition
        if: inputs.deployment_stage == 'service'
        env:
          DEPLOYMENT_RUNTIME_PROFILE: ${{ inputs.runtime_profile }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          SERVICE_JSON=$(python scripts/read_cloud_run_v2.py --project "$GCP_PROJECT_ID" --region us-east4 --kind services --name staff-tracer)
          export SERVICE_JSON
          python - <<'PY'
          import json, os
          from pathlib import Path

          service = json.loads(os.environ["SERVICE_JSON"])
          ready = service.get("terminalCondition", {})
          if ready.get("state") != "CONDITION_SUCCEEDED" or service.get("reconciling", False):
              raise SystemExit("cloud run v2 terminal condition must be succeeded and reconciled")
          if not service.get("generation") or service.get("observedGeneration") != service["generation"]:
              raise SystemExit("cloud run observed generation must match the current generation")
          if not service.get("latestReadyRevision") or service.get("latestReadyRevision") != service.get("latestCreatedRevision"):
              raise SystemExit("cloud run current revision must be ready")
          containers = service.get("template", {}).get("containers")
          if not isinstance(containers, list) or len(containers) != 1 or not isinstance(containers[0], dict):
              raise SystemExit("ready service must contain exactly one Cloud Run v2 container")
          image = containers[0].get("image")
          if image != os.environ["MANAGED_IMAGE"]:
              raise SystemExit("ready service image must match the direct Cosign-verified image")
          environment = {}
          for item in containers[0].get("env", []):
              if not isinstance(item, dict) or not isinstance(item.get("name"), str):
                  raise SystemExit("ready service environment is malformed")
              if item["name"] in environment:
                  raise SystemExit("ready service environment contains duplicate names")
              if "value" in item:
                  environment[item["name"]] = {"value": item.get("value")}
              else:
                  secret_ref = item.get("valueSource", {}).get("secretKeyRef", {})
                  environment[item["name"]] = {
                      "secret": secret_ref.get("secret"),
                      "version": secret_ref.get("version"),
                  }
          if os.environ["DEPLOYMENT_RUNTIME_PROFILE"] == "controlled_live_data_staff_pilot":
              expected_environment = {
                  "GOLDEN_ROSE_ENVIRONMENT": {"value": "production"},
                  "GOLDEN_ROSE_AUTH_MODE": {"value": "staff_oidc"},
                  "GOLDEN_ROSE_DEPLOYMENT_TARGET": {"value": "controlled-live-data-staff-pilot"},
                  "GOLDEN_ROSE_PUBLIC_ENVIRONMENT_LABEL": {"value": "Controlled live-data staff pilot"},
                  "GOLDEN_ROSE_DEPLOYED_IMAGE_DIGEST": {"value": os.environ["IMAGE_DIGEST"]},
                  "GOLDEN_ROSE_DEMO_ACCESS_ENABLED": {"value": "false"},
                  "GOLDEN_ROSE_PRESENTATION_DEMO_SEED_ENABLED": {"value": "false"},
                  "GOLDEN_ROSE_DATABASE_URL": {"secret": "runtime-database-url", "version": "latest"},
              }
              expected_staff_oidc_secret_names = {
                  "GOLDEN_ROSE_STAFF_OIDC_ISSUER": "staff-oidc-issuer",
                  "GOLDEN_ROSE_STAFF_OIDC_AUDIENCE": "staff-oidc-audience",
                  "GOLDEN_ROSE_STAFF_OIDC_JWKS_URL": "staff-oidc-jwks-url",
              }
              for name, secret_name in expected_staff_oidc_secret_names.items():
                  secret_ref = environment.get(name)
                  if secret_ref is None:
                      raise SystemExit(f"ready service missing {name}")
                  if secret_ref.get("secret") != secret_name:
                      raise SystemExit(f"ready service {name} secret drifted")
                  version = secret_ref.get("version")
                  if not isinstance(version, str) or not version.isdigit() or version == "0":
                      raise SystemExit(f"ready service {name} must pin an enabled numeric secret version")
                  expected_environment[name] = {"secret": secret_name, "version": version}
              if any(name in environment for name in ("GOLDEN_ROSE_DEMO_ACCESS_PASSWORD", "GOLDEN_ROSE_DEMO_ACCESS_EXPIRES_AT", "GOLDEN_ROSE_SYNTHETIC_STAFF_ID")):
                  raise SystemExit("ready service staff-pilot runtime still exposes demo or synthetic env")
          else:
              expected_environment = {
                  "GOLDEN_ROSE_ENVIRONMENT": {"value": "develop"},
                  "GOLDEN_ROSE_AUTH_MODE": {"value": "synthetic"},
                  "GOLDEN_ROSE_DEPLOYMENT_TARGET": {"value": "gcp-develop-private-synthetic"},
                  "GOLDEN_ROSE_PUBLIC_ENVIRONMENT_LABEL": environment.get("GOLDEN_ROSE_PUBLIC_ENVIRONMENT_LABEL"),
                  "GOLDEN_ROSE_DEPLOYED_IMAGE_DIGEST": {"value": os.environ["IMAGE_DIGEST"]},
                  "GOLDEN_ROSE_DEMO_ACCESS_ENABLED": {"value": "true"},
                  "GOLDEN_ROSE_DEMO_ACCESS_EXPIRES_AT": environment.get("GOLDEN_ROSE_DEMO_ACCESS_EXPIRES_AT"),
                  "GOLDEN_ROSE_PRESENTATION_DEMO_SEED_ENABLED": {"value": "true"},
                  "GOLDEN_ROSE_DEMO_ACCESS_PASSWORD": {"secret": "demo-access-password", "version": "latest"},
                  "GOLDEN_ROSE_DATABASE_URL": {"secret": "runtime-database-url", "version": "latest"},
                  "GOLDEN_ROSE_SYNTHETIC_STAFF_ID": {"secret": "synthetic-staff-id", "version": "latest"},
              }
              public_label = str(environment.get("GOLDEN_ROSE_PUBLIC_ENVIRONMENT_LABEL", {}).get("value", "")).lower()
              if "non-production" not in public_label or "synthetic" not in public_label:
                  raise SystemExit("ready service synthetic label posture drifted")
              if environment.get("GOLDEN_ROSE_DEMO_ACCESS_EXPIRES_AT", {}).get("value") in (None, ""):
                  raise SystemExit("ready service synthetic demo expiry is missing")
          if environment != expected_environment:
              raise SystemExit("ready service environment inventory or value drifted")
          expected_data_boundary = "controlled-live-data-staff-pilot" if os.environ["DEPLOYMENT_RUNTIME_PROFILE"] == "controlled_live_data_staff_pilot" else "fictional-synthetic-only"
          expected_labels = {
              "environment": "develop",
              "data_boundary": expected_data_boundary,
              "managed_by": "terraform",
              "service": "staff-tracer",
              "cost_center": "develop",
              "owner": "technical-owner",
              "teardown": "intentional-runbook-only",
              "goog-terraform-provisioned": "true",
          }
          if service.get("labels") != expected_labels:
              raise SystemExit("ready service label posture drifted")
          path = Path("build/deploy-result.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          payload.update({"result": "success", "current_stage": "service_readiness", "image_digest": os.environ["IMAGE_DIGEST"], "admitted_image_digest": os.environ["ADMITTED_IMAGE_DIGEST"]})
          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Record deploy result
        if: always()
        env:
          DEPLOYMENT_STAGE: ${{ inputs.deployment_stage }}
          DEPLOYMENT_RUNTIME_PROFILE: ${{ inputs.runtime_profile }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("build/deploy-result.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          payload.update({"current_stage": os.environ["DEPLOYMENT_STAGE"], "runtime_profile": os.environ["DEPLOYMENT_RUNTIME_PROFILE"], "image_digest": os.environ.get("IMAGE_DIGEST"), "admitted_image_digest": os.environ.get("ADMITTED_IMAGE_DIGEST"), "qualification_executed": False})
          path.write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload deploy result evidence
        if: always()
        # v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deploy-result
          path: build/deploy-result.json
          if-no-files-found: error
          retention-days: 14
